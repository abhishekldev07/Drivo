name: Apply passenger map attribution fix

on:
  push:
    branches:
      - fix-passenger-map-attribution

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace passenger attribution strip
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('flutter/lib/main.dart')
          text = path.read_text()
          old = "                const SimpleAttributionWidget(\n                  source: Text('OpenStreetMap contributors'),\n                  alignment: Alignment.topRight,\n                ),\n"
          new = "                const RichAttributionWidget(\n                  attributions: [\n                    TextSourceAttribution('OpenStreetMap contributors'),\n                  ],\n                  showFlutterMapAttribution: false,\n                ),\n"
          count = text.count(old)
          if count == 0:
              print('Passenger attribution block is already patched; nothing to do.')
          elif count == 1:
              path.write_text(text.replace(old, new, 1))
          else:
              raise SystemExit(f'Expected at most one passenger attribution block, found {count}.')
          PY

      - name: Commit source fix if needed
        run: |
          if git diff --quiet -- flutter/lib/main.dart; then
            echo "No source change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter/lib/main.dart
          git commit -m "fix: clean passenger map attribution"
          git push origin HEAD:fix-passenger-map-attribution
