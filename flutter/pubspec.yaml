name: drivo
description: 'Drivo ride-hailing app for passengers and drivers.'
publish_to: 'none'
version: 0.8.1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.9
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^12.0.0
  intl: ^0.19.0
  image_picker: 1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/branding/
